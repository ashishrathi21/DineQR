services:
  # Backend Web Service
  - type: web
    name: dineqr-backend
    env: node
    region: singapore
    buildCommand: cd server && npm install
    startCommand: cd server && npm start
    envVars:
      - key: PORT
        value: 5000
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true

  # Frontend Static Site
  - type: static
    name: dineqr-frontend
    env: static
    buildCommand: cd client && npm install && npm run build
    staticPublishPath: ./client/dist
    envVars:
      - key: VITE_API_URL
        value: https://dineqr-backend.onrender.com/api
      - key: VITE_SOCKET_URL
        value: https://dineqr-backend.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
